<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Label Academy</title>
<style>
:root{--gold:#C9A961;--goldlite:#F9E27D;--bg:#050505;--bg2:#0B0B0B;--bg3:#121212;--text:#E8E6E1;--sub:#8A8680;--line:#1F1F1F;--cyan:#4FD7FF;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.65 -apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--bg2);padding:22px 16px;overflow-y:auto;max-height:100vh}
.brand{font:800 12px/1 -apple-system;letter-spacing:2px;color:var(--sub)}
.brand b{display:block;font:800 22px/1.1 Georgia,serif;background:linear-gradient(120deg,var(--goldlite),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:3px}
#q{width:100%;margin:16px 0;padding:9px 12px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;color:var(--text);font:14px -apple-system}
.pill{font:700 11px/1 -apple-system;letter-spacing:1px;text-transform:uppercase;color:var(--goldlite);margin:16px 0 6px}
.pill span{color:var(--sub);font-weight:400}
.nav a{display:block;padding:7px 9px;border-radius:8px;color:var(--text);font-size:14px;border:1px solid transparent}
.nav a:hover{background:var(--bg3);text-decoration:none}
.nav a.active{border-color:rgba(201,169,97,.5);background:var(--bg3)}
.nav a .d{color:var(--sub);font-size:12px}
.main{padding:44px 40px 90px;max-width:820px}
h1{font:800 30px/1.15 Georgia,serif;background:linear-gradient(120deg,var(--goldlite),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0 10px}
h2{font:700 20px/1.3 -apple-system;color:var(--goldlite);margin:22px 0 8px}
h3{font:700 16px/1.3 -apple-system;color:var(--text);margin:16px 0 6px}
p{margin:10px 0} ul{margin:10px 0 10px 4px;list-style:none}
li{padding:5px 0 5px 22px;position:relative} li:before{content:"\2022";color:var(--gold);position:absolute;left:4px}
blockquote{border-left:3px solid var(--gold);padding:4px 0 4px 14px;margin:12px 0;font:italic 15px/1.5 Georgia,serif;color:#cfcabf}
.meta{color:var(--sub);font-size:13px;margin-bottom:8px}
.tag{display:inline-block;font:700 10px/1 -apple-system;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(79,215,255,.3);background:rgba(79,215,255,.1);padding:4px 8px;border-radius:99px;margin-right:6px}
.src{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:22px;background:rgba(11,11,11,.5)}
.src h4{color:var(--goldlite);font-size:13px;margin-bottom:6px}
.metricrow{display:flex;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
.metricrow .k{color:var(--sub);width:120px;font-weight:700;text-transform:uppercase;font-size:11px}
.metricrow .est{color:var(--gold);font-size:11px;font-style:italic}
.disc{border:1px solid rgba(232,176,75,.3);background:rgba(232,176,75,.08);border-radius:10px;padding:12px;font-size:13px;margin:14px 0;color:#e8e0cf}
.cp{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;background:var(--bg2)}
.cp .p{font-weight:600} .cp .a{color:var(--sub);font-size:14px;margin-top:4px;display:none}
.cp.open .a{display:block}
.about{border:1px solid var(--gold);border-radius:16px;padding:22px;margin-top:34px;background:var(--bg2)}
.about h2{color:var(--goldlite);margin-top:0}
.cta{display:inline-block;margin-top:10px;background:linear-gradient(120deg,var(--goldlite),var(--gold));color:#0A0A0A;font-weight:800;padding:12px 24px;border-radius:99px}
.cta:hover{text-decoration:none}
.foot{color:var(--sub);font-size:12px;margin-top:50px;border-top:1px solid var(--line);padding-top:18px}
.err{color:#ff9b9b}
@media(max-width:760px){#app{grid-template-columns:1fr}.side{max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<div id="app">
  <nav class="side">
    <div class="brand">BLACK LABEL<b>Academy</b></div>
    <input id="q" type="search" placeholder="Search the library…" autocomplete="off">
    <div id="nav" class="nav"></div>
  </nav>
  <main class="main" id="main"><p class="meta">Loading library…</p></main>
</div>
<script>
const OFFER = {trial:"7-day free trial", price:"$30/month", dl:"https://blacklabelbots.com/dl/academy.zip"};
const state = {data:null, current:null};

function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

async function boot(){
  try{
    const res = await fetch("academy-reader.json");
    if(!res.ok) throw new Error("HTTP "+res.status);
    state.data = await res.json();
  }catch(e){
    document.getElementById('main').innerHTML =
      '<p class="err">Could not load the library ('+esc(e.message)+'). '+
      'The reader bundle must be served alongside its academy-reader.json.</p>';
    return;
  }
  renderNav();
  renderHome();
}

function renderNav(filter){
  const nav = document.getElementById('nav');
  const f = (filter||'').trim().toLowerCase();
  let html = '<a href="#" data-home="1">\u2190 Library home</a>';
  for(const p of state.data.pillars){
    const items = state.data.entries.filter(e =>
      e.pillar===p.key && (!f || (e.title.toLowerCase().includes(f))));
    if(!items.length) continue;
    html += '<div class="pill">'+esc(p.title)+' <span>('+items.length+')</span></div>';
    for(const e of items){
      html += '<a href="#" data-id="'+esc(e.id)+'"'+(state.current===e.id?' class="active"':'')+'>'+
        esc(e.title)+'<div class="d">'+esc(e.difficulty)+' \u00b7 '+e.est_read_min+' min</div></a>';
    }
  }
  nav.innerHTML = html;
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    if(a.dataset.home){ state.current=null; renderHome(); renderNav(document.getElementById('q').value); }
    else openEntry(a.dataset.id);
  }));
}

function renderHome(){
  const d = state.data;
  let cards = '';
  for(const p of d.pillars){
    cards += '<div class="src"><h4>'+esc(p.title)+' \u00b7 '+p.count+'</h4><p class="meta">'+esc(p.subtitle)+'</p></div>';
  }
  document.getElementById('main').innerHTML =
    '<h1>The library</h1>'+
    '<p class="meta">'+d.entry_count+' lessons across '+d.pillars.length+' pillars. '+
    'Every figure is sourced or labeled an estimate.</p>'+ cards +
    '<div class="about"><h2>Your access</h2>'+
    '<p>Black Label Academy is a '+esc(OFFER.trial)+' \u2192 then '+esc(OFFER.price)+'. '+
    'The full library during the trial, new lessons every month, cancel anytime.</p>'+
    '<a class="cta" href="'+esc(OFFER.dl)+'">Start free trial — download Mac app</a></div>'+
    '<div class="foot">\u00a9 2026 Black Label \u00b7 Education, not financial or legal advice. '+
    'Every number is sourced or labeled an estimate.</div>';
}

function openEntry(id){
  const e = state.data.entries.find(x => x.id===id);
  if(!e){ renderHome(); return; }
  state.current = id;
  let h = '<p class="meta"><a href="#" id="back">\u2190 Library</a></p>';
  h += '<h1>'+esc(e.title)+'</h1>';
  h += '<p class="meta"><span class="tag">'+esc(e.difficulty)+'</span>'+e.est_read_min+
       ' min read \u00b7 updated '+esc(e.last_updated)+'</p>';
  if(e.attribution){
    const a = e.attribution;
    h += '<p class="meta">As taught by <b style="color:var(--goldlite)">'+esc(a.creator)+'</b>'+
         (a.url?' \u00b7 <a href="'+esc(a.url)+'" target="_blank" rel="noopener">source</a>':'')+'</p>';
  }
  if(e.disclaimer) h += '<div class="disc">\u26a0\ufe0f '+esc(e.disclaimer)+'</div>';
  if(e.metrics.length){
    let rows='';
    for(const m of e.metrics){
      rows += '<div class="metricrow"><span class="k">'+esc(m.key)+'</span><b>'+esc(m.value_display)+'</b>'+
        '<span class="'+(m.is_estimate?'est':'')+'" style="color:var(--sub)">'+esc(m.provenance)+'</span></div>';
    }
    h += '<div class="src"><h4>Market &amp; numbers — every figure sourced or labeled an estimate</h4>'+rows+'</div>';
  }
  h += e.body_html;   // pre-sanitized server-side (md_to_html)
  if(e.checkpoints.length){
    h += '<h2>Check yourself</h2>';
    e.checkpoints.forEach((c,i) => {
      h += '<div class="cp" data-cp="'+i+'"><div class="p">'+esc(c.prompt)+'</div>'+
        '<div class="a">'+esc(c.answer)+
        (c.source_url?' \u00b7 <a href="'+esc(c.source_url)+'" target="_blank" rel="noopener">source</a>':'')+
        '</div></div>';
    });
  }
  if(e.sources.length){
    let lis='';
    for(const s of e.sources){
      lis += '<li>'+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>':esc(s.label))+'</li>';
    }
    h += '<div class="src"><h4>Sources</h4><ul>'+lis+'</ul></div>';
  }
  const main = document.getElementById('main');
  main.innerHTML = h; main.scrollTop = 0; window.scrollTo(0,0);
  main.querySelector('#back').addEventListener('click', ev => {
    ev.preventDefault(); state.current=null; renderHome(); renderNav(document.getElementById('q').value);
  });
  main.querySelectorAll('.cp').forEach(cp => cp.addEventListener('click', () => cp.classList.toggle('open')));
  renderNav(document.getElementById('q').value);
}

document.getElementById('q').addEventListener('input', ev => renderNav(ev.target.value));
boot();
</script>
</body></html>
