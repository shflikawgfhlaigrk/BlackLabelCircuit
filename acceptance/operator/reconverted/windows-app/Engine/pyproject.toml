[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blacklabel-operator"
version = "0.9.0"
description = "Durable multi-CLI agent orchestration with exact Sol acceptance profiles"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Black Label" }]
keywords = ["agent", "cli", "codex", "mcp", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://operator.blacklabelbots.com"

[project.scripts]
operator = "blacklabel_operator.cli:main"
blacklabel-operator = "blacklabel_operator.cli:main"
sol = "blacklabel_operator.cli:main"
operator-mcp = "blacklabel_operator.mcp_server:main"

[tool.setuptools.packages.find]
include = ["blacklabel_operator*"]

[tool.setuptools.package-data]
blacklabel_operator = ["resources/*"]
