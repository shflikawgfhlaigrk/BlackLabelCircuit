name: Portfolio Windows reconversion acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/circuit-live-wallpaper-windows-acceptance]
permissions: { contents: read }
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: marketing, featureCount: 16 }
          - { app: trading, featureCount: 10 }
          - { app: realestate, featureCount: 8 }
          - { app: operator, featureCount: 18 }
          - { app: ace, featureCount: 12 }
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: acceptance/${{ matrix.app }}/reconverted/windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Verify clean second-conversion bytes
        shell: pwsh
        run: |
          foreach($line in (Get-Content ../windows-app.sha256)) {
            if($line -notmatch '^([0-9a-f]{64})  \./(.+)$'){throw "invalid checksum row: $line"}
            if((Get-FileHash $Matches[2] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]){throw "second-conversion hash mismatch: $($Matches[2])"}
          }
      - name: Prove first and second conversions are byte-identical
        shell: pwsh
        run: |
          $first=Resolve-Path ../../../${{ matrix.app }}/generated/windows-app
          $second=Resolve-Path .
          $firstRows=Get-ChildItem $first -File -Recurse|Where-Object{$_.FullName -notmatch '[\\/]artifacts[\\/]'}|ForEach-Object{$r=$_.FullName.Substring($first.Path.Length+1);"$r|$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"}
          $secondRows=Get-ChildItem $second -File -Recurse|Where-Object{$_.FullName -notmatch '[\\/]artifacts[\\/]'}|ForEach-Object{$r=$_.FullName.Substring($second.Path.Length+1);"$r|$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"}
          if(Compare-Object ($firstRows|Sort-Object) ($secondRows|Sort-Object)){throw 'first and clean second conversion differ'}
      - name: Compile install launch parity package uninstall
        shell: pwsh
        run: ./acceptance.ps1
      - name: Validate second native Windows receipt
        shell: pwsh
        run: |
          $r=Get-Content artifacts/windows-acceptance.json -Raw|ConvertFrom-Json
          $features=Get-Content feature-matrix.json -Raw|ConvertFrom-Json
          if(-not $r.compiled-or-not $r.installed-or-not $r.launched-or-not $r.selfTestPassed-or-not $r.shipsEmpty-or-not $r.uninstalled-or $r.requiredResiduals-ne 0-or $r.package.sha256-notmatch '^[0-9a-f]{64}$'-or $features.requiredResiduals-ne 0-or $features.features.Count-ne ${{ matrix.featureCount }}){throw 'second native Windows acceptance failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows-reconversion-${{ github.run_id }}
          path: acceptance/${{ matrix.app }}/reconverted/windows-app/artifacts/*
          if-no-files-found: error
          retention-days: 14
